<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S5.1 plugin runtime</title>
    <link rel="stylesheet" href="./harness-nav.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #gantt {
        --fg-row-height: 32px;
        --fg-grid-pane-width: 220px;
        border: 1px solid #ccc;
        height: 50vh;
      }
      .fg-tick {
        font-size: 10px;
      }
      .fg-row {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fg-bar {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      #controls button {
        font: inherit;
      }
      #log {
        margin-top: 1rem;
        max-height: 180px;
        overflow-y: auto;
        border: 1px solid #ccc;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        padding: 0.5rem;
      }
      #log div {
        padding: 1px 0;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S5.1 plugin runtime</h1>
    <nav class="harness-site-nav" aria-label="Harness pages"></nav>
    <p>
      <code>gantt.plugins</code> live, over the public plugin contract alone (`plans/s5-extensibility-and-
      editing/s5.1-plugin-runtime.md`). The button below installs and removes a two-line logging plugin — the
      bars keep their identity across both (I8); nothing remounts.
    </p>
    <div id="controls">
      <button id="toggle-plugin-btn" type="button">Install logging plugin</button>
      <button id="open-popup-btn" type="button">Open popup on selected bar</button>
    </div>
    <div id="gantt"></div>
    <div id="log" aria-label="Plugin event log"></div>
    <script type="module" src="./plugins.ts"></script>
  </body>
</html>
