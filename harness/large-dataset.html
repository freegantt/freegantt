<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S1.11 large dataset</title>
    <link rel="stylesheet" href="./harness-nav.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #gantt {
        --fg-row-height: 32px;
        --fg-grid-pane-width: 220px;
        border: 1px solid #ccc;
        height: 70vh;
      }
      /* Structural origin (top/left) for .fg-tick/.fg-row now ships in the library's own base
         stylesheet (S1.11, D-S1.11-8) — this harness keeps only the typography it legitimately owns. */
      .fg-tick {
        font-size: 10px;
      }
      .fg-row {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fg-bar {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S1.11 large dataset</h1>
    <nav class="harness-site-nav" aria-label="Harness pages"></nav>
    <p>
      e2e fixture for S1's <code>[S1-A1]</code> acceptance check (plans/s1.11-close-the-gate/README.md
      D-S1.11-5): 5,000 seeded entries at <code>zoom: 'preset'</code>, content wider than the pane, so the DOM
      holds only the windowed rows the whole time.
    </p>
    <div id="gantt"></div>
    <script type="module" src="./large-dataset.ts"></script>
  </body>
</html>
