<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S1 timeline & viewport</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #gantt {
        /* Level-1 theming (plans/02 §4): row height is a CSS custom property the library reads,
           not a restated constructor default (#39). */
        --fg-row-height: 32px;
        /* Grid pane width; PaneLayout owns applying this to the grid pane and its row layer so
           they share one coordinate frame with the timeline pane (S1.8, D-S1.8-1/D-S1.8-2) — this
           harness no longer restates it as raw CSS. Renamed from --fg-row-label-width: the gutter
           is a pane width now, not a backend reservation. */
        --fg-grid-pane-width: 220px;
        border: 1px solid #ccc;
        /* No overflow/position rule here any more (S1.8): PaneLayout builds the grid pane / splitter
           / timeline pane structure inline, and the timeline pane is the library's own native
           scroller (D-D, D-S1.8-1). This host only sizes the whole shell. */
        height: 70vh;
      }
      .fg-header {
        height: 20px;
        border-bottom: 1px solid #ddd;
        background: #fafafa;
      }
      .fg-tick {
        top: 0;
        font-size: 10px;
        color: #666;
        padding-left: 2px;
        white-space: nowrap;
        border-left: 1px solid #eee;
        height: 20px;
        line-height: 20px;
      }
      .fg-row {
        left: 0;
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #333;
      }
      .fg-bar {
        background: #4a7a58;
        color: white;
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S1 timeline &amp; viewport</h1>
    <p>Fixture project rendered as positioned bars under a day-tick header. Every slice adds to this page.</p>
    <div id="gantt"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
