<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S1 timeline & viewport</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #chart {
        position: relative;
        border: 1px solid #ccc;
        overflow: auto;
        height: 70vh;
      }
      .fg-header {
        height: 20px;
        border-bottom: 1px solid #ddd;
        background: #fafafa;
      }
      .fg-tick {
        top: 0;
        font-size: 10px;
        color: #666;
        padding-left: 2px;
        white-space: nowrap;
        border-left: 1px solid #eee;
        height: 20px;
        line-height: 20px;
      }
      .fg-bar {
        background: #4a7a58;
        color: white;
        font-size: 11px;
        line-height: 32px;
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S1 timeline &amp; viewport</h1>
    <p>Fixture project rendered as positioned bars under a day-tick header. Every slice adds to this page.</p>
    <div id="chart"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
