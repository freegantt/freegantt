<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S1 timeline & viewport</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #gantt {
        /* Level-1 theming (plans/02 §4): row height is a CSS custom property the library reads,
           not a restated constructor default (#39). */
        --fg-row-height: 32px;
        position: relative;
        border: 1px solid #ccc;
        /* overflow: auto makes the browser the scroll owner — ScrollModel (#9) doesn't exist yet, so
           there is no library-owned scroll to use instead. Tracked in #41 until #9 lands. */
        overflow: auto;
        height: 70vh;
      }
      .fg-header {
        height: 20px;
        border-bottom: 1px solid #ddd;
        background: #fafafa;
      }
      .fg-tick {
        top: 0;
        font-size: 10px;
        color: #666;
        padding-left: 2px;
        white-space: nowrap;
        border-left: 1px solid #eee;
        height: 20px;
        line-height: 20px;
      }
      .fg-rows {
        /* Row labels sit behind bars, both positioned from the same frame.rows/frame.bars geometry. */
        position: absolute;
        inset: 0;
        top: 20px;
      }
      .fg-row {
        position: absolute;
        left: 0;
        width: 220px;
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #333;
      }
      .fg-bars {
        position: absolute;
        inset: 0;
        top: 20px;
        left: 220px;
      }
      .fg-bar {
        background: #4a7a58;
        color: white;
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S1 timeline &amp; viewport</h1>
    <p>Fixture project rendered as positioned bars under a day-tick header. Every slice adds to this page.</p>
    <div id="gantt"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
