<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S1 timeline & viewport</title>
    <link rel="stylesheet" href="./harness-nav.css" />
    <style>
      :root {
        --page-bg: #fafaf7;
        --page-ink: #1a1815;
        --page-muted: #5e5a53;
        --page-border: #e6e2d9;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --page-bg: #15161a;
          --page-ink: #eceae3;
          --page-muted: #a8a49b;
          --page-border: #2b2f36;
        }
      }
      :root[data-theme='light'] {
        --page-bg: #fafaf7;
        --page-ink: #1a1815;
        --page-muted: #5e5a53;
        --page-border: #e6e2d9;
      }
      :root[data-theme='dark'] {
        --page-bg: #15161a;
        --page-ink: #eceae3;
        --page-muted: #a8a49b;
        --page-border: #2b2f36;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: var(--page-bg);
        color: var(--page-ink);
      }
      .theme-toggle {
        display: inline-flex;
        gap: 0.25rem;
        margin-bottom: 1rem;
      }
      .theme-toggle button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.3rem 0.7rem;
        border: 1px solid var(--page-border);
        background: var(--page-bg);
        color: var(--page-ink);
        border-radius: 4px;
        cursor: pointer;
      }
      .theme-toggle button[aria-pressed='true'] {
        background: var(--page-ink);
        color: var(--page-bg);
      }
      #gantt {
        /* Level-1 theming (plans/02 §4): row height is a CSS custom property the library reads,
           not a restated constructor default (#39). */
        --fg-row-height: 32px;
        /* Grid pane width; PaneLayout owns applying this to the grid pane and its row layer so
           they share one coordinate frame with the timeline pane (S1.8, D-S1.8-1/D-S1.8-2) — this
           harness no longer restates it as raw CSS. Renamed from --fg-row-label-width: the gutter
           is a pane width now, not a backend reservation. */
        --fg-grid-pane-width: 220px;
        border: 1px solid var(--page-border);
        /* No overflow/position rule here any more (S1.8): PaneLayout builds the grid pane / splitter
           / timeline pane structure inline, and the timeline pane is the library's own native
           scroller (D-D, D-S1.8-1). This container only sizes the whole shell. */
        height: 70vh;
      }
      /* Colour/background/border/border-radius for .fg-header/.fg-tick/.fg-row/.fg-bar, and their
         top/left origin, now ship in the library's own base stylesheet (S1.10/S1.11, view/styles.ts)
         — this harness keeps only the typography that stays legitimately harness-owned (D-S1.11-8). */
      .fg-tick {
        font-size: 10px;
      }
      .fg-row {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fg-bar {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
        margin: 1rem 0;
        font-size: 0.9rem;
      }
      #toolbar select,
      #toolbar button {
        font: inherit;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      #controls label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.9rem;
      }
      #selection-readout {
        margin: 0;
        font-size: 0.85rem;
        color: var(--page-muted);
      }
      #controls button {
        font: inherit;
        font-size: 0.9rem;
      }
      #controls input {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S1 timeline &amp; viewport</h1>
    <nav class="harness-site-nav" aria-label="Harness pages"></nav>
    <p>Fixture dataset rendered as positioned bars under a day-tick header. Every slice adds to this page.</p>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="auto">Auto</button>
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
    </div>
    <div id="controls">
      <p id="selection-readout">Selection: (none)</p>
      <label>Name <input id="rename-input" type="text" size="20" /></label>
      <button id="rename-btn" type="button">Rename</button>
      <button id="remove-btn" type="button">Remove</button>
      <button id="undo-btn" type="button">Undo</button>
      <button id="redo-btn" type="button">Redo</button>
      <label>
        Snap
        <select id="snap-unit">
          <option value="tick">Auto (preset's tick)</option>
          <option value="none">Off</option>
          <option value="hour">Hour</option>
          <option value="day">Day</option>
          <option value="week">Week</option>
        </select>
      </label>
      <label>
        Every
        <input id="snap-increment" type="number" min="1" step="1" value="1" size="3" />
      </label>
    </div>
    <div id="toolbar"></div>
    <div id="gantt"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
