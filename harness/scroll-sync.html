<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FreeGantt harness — S1.5 scroll sync</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      .fg-gantt {
        --fg-row-height: 32px;
        --fg-grid-pane-width: 220px;
        border: 1px solid #ccc;
      }
      #tall {
        height: 240px;
        margin-bottom: 1rem;
      }
      #short {
        height: 240px;
      }
      /* Colour/background/border/border-radius for .fg-header/.fg-tick/.fg-row/.fg-bar, and their
         top/left origin, now ship in the library's own base stylesheet (S1.10/S1.11, view/styles.ts)
         — this harness keeps only the typography that stays legitimately harness-owned (D-S1.11-8). */
      .fg-tick {
        font-size: 10px;
      }
      .fg-row {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fg-bar {
        font-size: 11px;
        line-height: var(--fg-row-height);
        padding: 0 6px;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>FreeGantt — S1.5 scroll sync</h1>
    <nav style="display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 0.9rem; margin-bottom: 1rem">
      <a href="./index.html">Timeline &amp; viewport</a>
      <a href="./docs/">Docs</a>
      <a href="./zoom.html">Timeline &amp; navigation</a>
      <a href="./large-dataset.html">Large dataset</a>
      <a href="./data.html">Mutation &amp; live binding</a>
    </nav>
    <p>Two Gantts sharing one ScrollModel. #tall has every fixture entry; #short has the first 20.</p>
    <div id="tall" class="fg-gantt"></div>
    <div id="short" class="fg-gantt"></div>
    <script type="module" src="./scroll-sync.ts"></script>
  </body>
</html>
