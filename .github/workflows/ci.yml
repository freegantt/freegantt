name: CI

# The proof lives on the server. A ready pull request runs the browser-free chain and Playwright
# on Chromium, Firefox, and WebKit in parallel. There is no pre-push hook: a push is cheap, and CI
# is the gate. `pnpm verify:full` remains the local command that runs `verify` then Chromium e2e.
#
# This repo is public. Standard GitHub-hosted runners cost no Actions minutes here, so parallel
# jobs buy wall-clock. The old one-job shape saved billed minutes that a private repo spends;
# this one does not. The `gate` job still reports one required check: it needs every job below.
#
# The workflow holds no leaf check list. `pnpm verify` reads its chain from `package.json`, and
# the e2e job runs Playwright's three projects. A check joins CI when it joins `verify` or
# `playwright.config.ts`. `test/guards/gate-is-one-command.test.ts` fails the build when a leaf
# script (`lint`, `test:node`, …) appears as its own step, or when an engine drops out of the matrix.
#
# Triggers are pull-request-only, and a draft never runs. `ready_for_review` is not a default
# event type, so it is listed here: converting a draft with `gh pr ready` is what starts the
# first run. Work in progress costs no minutes. `pnpm open-pr` opens every pull request as a
# draft for exactly that reason (docs/04 §5.2).
#
# There is no `push:` trigger, by decision. A push to a branch with a ready pull request already
# runs through `synchronize`, and a push to `main` lands a merge this workflow just proved. The
# one case a green run can go stale — `main` moved underneath the branch — is branch protection's
# "require branches to be up to date before merging", which re-runs the gate only when it happens.
#
# `closed` fires on a merge and on a close-without-merge alike, and either way the run in flight
# for that branch has nothing left to prove — the PR it was gating is gone. `closed` earns no
# job of its own (see the `if:` below); it exists only to make the concurrency group below
# see a new run and cancel the stale one. That run reports `skipped`, the same zero-cost shape a
# draft's first push already gets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

# A new push supersedes the run before it. Cancelling keeps the minutes on the commit that is
# actually up for review.
#
# The key is the branch name, and it has to be. Two event types reach this workflow for one branch.
# `pull_request` carries a number. `workflow_dispatch` carries none, so the old key fell back to
# `github.ref` for it. One branch then produced two groups — `ci-341` and
# `ci-refs/heads/fix/341-...` — and nothing cancelled anything. Both runs ran the whole gate, in
# parallel, and billed twice.
#
# `head.ref` and `ref_name` are both the plain branch name, so the two doors land in one group.
# `github.ref_name` is `341/merge` on a `pull_request` event, which is why that side reads
# `head.ref` instead.
#
# `workflow_dispatch` stays as a human door. It is not how `pr-wait` closes. A dispatch run is on
# the branch, not the pull request, so it cannot close that wait, and this group cancels the live
# `pull_request` run when one is already going (#415).
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # These four actions run on the node24 runtime, and that is why the majors look new. An
      # action declares its own runtime in its own `action.yml`. That runtime is not the Node this
      # project runs on — `.nvmrc` sets that one, and it already says 24. At `@v4` all four
      # declared `node20`, which GitHub deprecated on 2025-09-19. GitHub forced them onto node24
      # anyway, and annotated every run with a warning. The warning named the actions, never this
      # repo's code, so no `.nvmrc` edit could ever silence it. Only a major bump does. Keep each
      # major at or above the first one that declares node24: checkout v5, setup-node v5, cache
      # v5, pnpm/action-setup v5.
      # `check-bundle-growth` (#342) needs `main`'s history to find the merge-base, and the
      # default shallow, single-ref checkout does not carry it. `fetch-depth: 0` is the full
      # history, so `origin/main` resolves and `git merge-base` has commits to search.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # setup-node caches nothing here. The `actions/cache` steps below do the caching, on keys
      # this file owns. Keep it that way: setup-node v6 limits its own automatic cache to npm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # `node_modules` is cached whole, keyed on the lockfile and the pinned Node version. A run
      # that changes no dependency installs nothing at all. Caching the directory rather than the
      # pnpm store is what buys that: the store still leaves the link step to run.
      - id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The browser-free chain. `FG_PR_ID` is `check-bundle-growth`'s (#342) ledger key.
      # `pull_request` carries a number, so that wins. `workflow_dispatch` carries none —
      # `pull_request.number` reads as an empty string there — so the branch name stands in, the
      # same fallback the script itself uses locally (a pull request has no number yet there).
      - run: pnpm verify
        env:
          FG_PR_ID: ${{ github.event.pull_request.number || github.ref_name }}

  e2e:
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Read the version from the installed package, never from `pnpm exec` output. `pnpm exec`
      # writes its own banner to stdout — "Already up to date" and "Done in 351ms using pnpm
      # v11.22.0" — whenever it decides the project needs an install check. `awk '{ print $NF }'`
      # then returns one last-field per line, so `$GITHUB_OUTPUT` receives three lines where it
      # needs one `key=value`. The run dies on the second: `Invalid format 'v11.22.0'`. That is a
      # pnpm version string standing in for Playwright's, which is the tell. The banner is not
      # deterministic — it depends on whether the lockfile looks settled — so the step passed on
      # most branches and failed on the one that changed dependencies (#355). `require(...)` reads
      # the same install with no wrapper in front of it, so there is no banner to strip.
      #
      # The cache key includes the engine, so a Chromium hit never serves a Firefox tree. A miss
      # downloads that engine and its system libraries. A hit still needs `install-deps` for
      # Firefox and WebKit: those libraries live on the runner image, not in the cache. Chromium's
      # libraries already ship on `ubuntu-latest`, so a Chromium hit skips apt.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - if: steps.browsers.outputs.cache-hit == 'true' && matrix.project != 'chromium'
        run: pnpm exec playwright install-deps ${{ matrix.project }}

      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # One required check. GitHub's matrix reports each engine as its own check; this job is the
  # merge gate so branch protection can name `gate` and nothing else. `always()` is what makes a
  # failed child produce a red check here rather than a skip.
  gate:
    if: always() && github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        run: |
          echo "verify=${{ needs.verify.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            exit 1
          fi
