name: CI

# One gate, three callers: an agent, `.githooks/pre-push`, and this workflow. All three run
# `pnpm verify:full`, so no caller can prove a different thing from the others (#255).
#
# Triggers are pull-request-only, and a draft never runs. `ready_for_review` is not a default
# event type, so it is listed here: converting a draft with `gh pr ready` is what starts the
# first run. Work in progress costs no minutes. `pnpm open-pr` opens every pull request as a
# draft for exactly that reason (docs/04 §5.2).
#
# There is no `push:` trigger, by decision. A push to a branch with a ready pull request already
# runs through `synchronize`, and a push to `main` lands a merge this workflow just proved. The
# one case a green run can go stale — `main` moved underneath the branch — is branch protection's
# "require branches to be up to date before merging", which re-runs the gate only when it happens.
#
# `closed` fires on a merge and on a close-without-merge alike, and either way the run in flight
# for that branch has nothing left to prove — the PR it was gating is gone. `closed` earns no
# `gate` run of its own (see the `if:` below); it exists only to make the concurrency group below
# see a new run and cancel the stale one. That run reports `skipped`, the same zero-cost shape a
# draft's first push already gets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

# A new push supersedes the run before it. Cancelling keeps the minutes on the commit that is
# actually up for review.
#
# The key is the branch name, and it has to be. Two event types reach this workflow for one branch.
# `pull_request` carries a number. `workflow_dispatch` carries none, so the old key fell back to
# `github.ref` for it. One branch then produced two groups — `ci-341` and
# `ci-refs/heads/fix/341-...` — and nothing cancelled anything. Both runs ran the whole gate, in
# parallel, and billed twice.
#
# That is not a rare path. `docs/04` §5.2 tells a reader to run `gh workflow run ci.yml --ref
# <branch>` when `gh pr ready` does not fire the trigger. The advice is right, and it doubled the
# cost every time the pull request run had in fact started. It hit four branches before anyone
# read the bill.
#
# `head.ref` and `ref_name` are both the plain branch name, so the two doors land in one group.
# `github.ref_name` is `341/merge` on a `pull_request` event, which is why that side reads
# `head.ref` instead.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # One job, not one job per check. GitHub bills a job by the minute, rounded up, and every job
  # pays for its own checkout and install before it does ten seconds of work. Eleven such jobs
  # cost about twenty billed minutes for a gate that runs in about one. Steps inside a job are
  # free, and `pnpm verify:full` names the check that stopped the run in its verdict line, so the
  # fan-out bought a slightly prettier failure page and nothing else.
  gate:
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # These four actions run on the node24 runtime, and that is why the majors look new. An
      # action declares its own runtime in its own `action.yml`. That runtime is not the Node this
      # project runs on — `.nvmrc` sets that one, and it already says 24. At `@v4` all four
      # declared `node20`, which GitHub deprecated on 2025-09-19. GitHub forced them onto node24
      # anyway, and annotated every run with a warning. The warning named the actions, never this
      # repo's code, so no `.nvmrc` edit could ever silence it. Only a major bump does. Keep each
      # major at or above the first one that declares node24: checkout v5, setup-node v5, cache
      # v5, pnpm/action-setup v5.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # setup-node caches nothing here. The `actions/cache` steps below do the caching, on keys
      # this file owns. Keep it that way: setup-node v6 limits its own automatic cache to npm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # `node_modules` is cached whole, keyed on the lockfile and the pinned Node version. A run
      # that changes no dependency installs nothing at all. Caching the directory rather than the
      # pnpm store is what buys that: the store still leaves the link step to run.
      - id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Chromium is cached against the Playwright version that drives it, read from the install
      # rather than from a second copy of the version here. A Playwright bump busts this key and
      # nothing else does. `--with-deps` runs only on a miss; the runner image already carries the
      # system libraries Chromium needs, so a hit needs no apt step. If a future image drops one,
      # the fix is `pnpm exec playwright install-deps chromium` on the hit path, not a wider key.
      # Read the version from the installed package, never from `pnpm exec` output. `pnpm exec`
      # writes its own banner to stdout — "Already up to date" and "Done in 351ms using pnpm
      # v11.22.0" — whenever it decides the project needs an install check. `awk '{ print $NF }'`
      # then returns one last-field per line, so `$GITHUB_OUTPUT` receives three lines where it
      # needs one `key=value`. The run dies on the second: `Invalid format 'v11.22.0'`. That is a
      # pnpm version string standing in for Playwright's, which is the tell. The banner is not
      # deterministic — it depends on whether the lockfile looks settled — so the step passed on
      # most branches and failed on the one that changed dependencies (#355). `require(...)` reads
      # the same install with no wrapper in front of it, so there is no banner to strip.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The gate itself. Every check the local gate runs, in the same order, from one script that
      # reads its check list out of `package.json` at run time. A check cannot join `verify` and
      # miss CI, and CI cannot run a spelling of the gate that nobody runs locally.
      - run: pnpm verify:full
